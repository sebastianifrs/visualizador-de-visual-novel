<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sebastian MM' Hoff">
    <title>Contato - Visualizador de Visual Novels</title>
    <link rel="shortcut icon" href="../image/icovvn.ico" type="image/x-icon">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/contato.css">
</head>
<body>
    <header>
        <div class="titulo-header">
            <img class="imagem-header" src="../image/fotovvn.png" alt="Logo do Visualizador de Visual Novels" width="56" height="56">
            <h1 class="textoTitulo-header">Visualizador de Visual Novels</h1>
        </div>

        <nav class="nav-header" aria-label="Navegação principal">
            <ul>
                <li><a href="../index.html">Casa</a></li>
                <li><a href="analises.html">Análises</a></li>
                <li><a href="contato.html" aria-current="page">Contato</a></li>
            </ul>
        </nav>
    </header>
    <hr class="hr-sobheader">

    <main>
        
        <form action="#" method="post" id = "formContato">
            <h1>Contato</h1>
            <div class="campo-form">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Nome" required>
            </div>

            <div class="campo-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="email@email.com" required>
            </div>

            <div class="campo-form">
                <label for="tipo-mensagem">Tipo de mensagem</label>
                <select id="tipo-mensagem" name="tipo-mensagem" required>
                    <option value="" disabled selected> Seleciona uma opção </option>
                    <option value="sugestao-vn"> Sugestão de Visual Novel </option>
                    <option value="sugestao-site"> Sugestão de melhoria no site </option>
                </select>
            </div>

            <div class="campo-form">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="6" placeholder="Mensagem" required></textarea>
            </div>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </main>

    <hr class="hr-sobheader">
    <footer>
        <center>
            <p>© Sebastian MM' Hoff 2026</p>
        </center>
    </footer> <!--Colocar o o copyright-->

</body>
</html>
