        <section class="filtros">

                <div id="generos-container"></div>
            </div>

            <div class="filtro-letra">

                <div id="letras-container"></div>
            </div>

            <div class="filtro-estudio">

            </div>

            <div class="filtro-adulto">
                <h3>Conteúdo adulto</h3>

                <label> <input type="radio" name="adulto" value="todos" checked>Todos </label>
                <label> <input type="radio" name="adulto" value="sim">Sim </label>
                <label> <input type="radio" name="adulto" value="nao">Não </label>
            </div>

            <button type="button" id="aplicar-filtros" onclick="aplicarFiltros()">Aplicar filtros</button>

        </section>
